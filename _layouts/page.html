---
layout: default
---

<article class="article">
    <div class="wrap wrap--narrow">

        {% unless page.hide_title %}
        <header class="article__header">
            <h1 class="article__title">{{ page.title }}</h1>
        </header>
        {% endunless %}

        <div class="article__body">
            {{ content }}
        </div>

    </div>
</article>
