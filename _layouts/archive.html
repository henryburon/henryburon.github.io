---
layout: default
title: Archive
---

<section class="section">
    <div class="wrap">
        <div class="section__head">
            <h1 class="section__label">{{ page.type }}: {{ page.title }}</h1>
            <span class="section__count">{{ page.posts.size }} projects</span>
        </div>

        <div class="grid">
            {% for post in page.posts %}
                {% include postbox.html %}
            {% endfor %}
        </div>
    </div>
</section>
