---
title: "Categories"
layout: default
permalink: "/categories.html"
---

<section class="section">
    <div class="wrap">
        <div class="section__head">
            <h1 class="section__label">Browse by category</h1>
        </div>

        {% for category in site.categories %}
        <div class="archive-group">
            <h2 class="archive-group__title" id="{{ category[0] | replace: ' ', '-' }}">{{ category[0] }}</h2>

            <div class="grid">
                {% for post in category[1] %}
                    {% if post.title %}
                        {% include postbox.html %}
                    {% endif %}
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </div>
</section>
