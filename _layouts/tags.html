---
title: "Tags"
layout: default
permalink: "/tags.html"
---

<section class="section">
    <div class="wrap">
        <div class="section__head">
            <h1 class="section__label">Browse by tag</h1>
        </div>

        {% for tag in site.tags %}
        <div class="archive-group">
            <h2 class="archive-group__title" id="{{ tag[0] | replace: ' ', '-' }}">{{ tag[0] }}</h2>

            <div class="grid">
                {% for post in tag[1] %}
                    {% if post.title %}
                        {% include postbox.html %}
                    {% endif %}
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </div>
</section>
