<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d10">

<link rel="icon" href="{{ site.baseurl }}/assets/images/logo.png">

<title>{% if page.url == "/" %}{{ site.name }} — {{ site.description }}{% else %}{{ page.title }} | {{ site.name }}{% endif %}</title>

{% seo title=false %}

<link href="{{ site.baseurl }}/assets/css/screen.css" rel="stylesheet">
<link href="{{ site.baseurl }}/assets/css/main.css" rel="stylesheet">

{% if site.google_analytics and jekyll.environment == 'production' %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics }}');
</script>
{% endif %}

</head>

<body class="layout-{{ page.layout | default: 'default' }}">

<a class="skip-link" href="#main">Skip to content</a>

<!-- Navigation
================================================== -->
<header class="nav">
    <div class="nav__inner">
        <a class="nav__brand" href="{{ site.baseurl }}/">
            <span class="nav__dot" aria-hidden="true"></span>
            <span>{{ site.name }}</span>
        </a>

        <nav aria-label="Main">
            <ul class="nav__links">
                <li>
                    <a class="nav__link" href="{{ site.baseurl }}/"
                       {% if page.url == "/" %}aria-current="page"{% endif %}>Work</a>
                </li>
                <li>
                    <a class="nav__link" href="{{ site.baseurl }}/HenryBuron_About"
                       {% if page.url == "/HenryBuron_About" %}aria-current="page"{% endif %}>About</a>
                </li>
                <li>
                    <a class="nav__link" href="https://github.com/henryburon" target="_blank" rel="noopener">GitHub</a>
                </li>
            </ul>
        </nav>
    </div>
</header>

<!-- Content
================================================== -->
<main id="main" class="site-main">
    {{ content }}
</main>

<!-- Footer
================================================== -->
<footer class="footer">
    <div class="wrap">
        <div class="footer__inner">
            <span>© {{ site.time | date: "%Y" }} {{ site.name }}</span>
            <ul class="footer__links">
                <li><a href="https://github.com/henryburon" target="_blank" rel="noopener">GitHub</a></li>
                <li><a href="{{ site.authors.Henry.LinkedIn }}" target="_blank" rel="noopener">LinkedIn</a></li>
                <li><a href="mailto:{{ site.authors.Henry.email }}">Email</a></li>
            </ul>
        </div>
    </div>
</footer>

</body>
</html>
